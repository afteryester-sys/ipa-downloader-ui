# Triggered when v0 pushes to a v0/** branch.
# 1. Checks out main, merges the v0 branch into it.
# 2. Bumps the patch version directly on main (never writes back to v0/**).
# 3. Pushes main — this triggers auto-release.yml which builds the installer.
#
# Deliberately does NOT push anything back to the v0/** branch so that v0
# can always push cleanly on the next change.
name: Merge v0 branch into main

on:
  push:
    branches: ["v0/**"]

jobs:
  merge-and-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # needed to dispatch auto-release.yml

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ---- Merge v0 branch into main (already on main) --------------------
      - name: Fetch v0 branch
        run: git fetch origin ${{ github.ref_name }}

      # A conflict must never be committed: `|| true` once pushed conflict markers
      # into main, which broke the csproj for every later build. The version line is
      # resolved in main's favour automatically (main owns it, see the bump below);
      # anything else stops the job with the conflicting paths printed.
      - name: Merge v0 branch
        run: |
          set -euo pipefail
          VERSION_FILE="src/IPAStudio.App/IPAStudio.App.csproj"

          if git merge --no-ff "origin/${{ github.ref_name }}" \
               -m "chore: merge ${{ github.ref_name }} -> main [auto]"; then
            echo "Merged cleanly."
          else
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "Conflicting paths:"; echo "$CONFLICTS"

            if [ "$CONFLICTS" = "$VERSION_FILE" ]; then
              echo "Only the version file conflicts - keeping main's version."
              git checkout --ours "$VERSION_FILE"
              git add "$VERSION_FILE"
              git commit --no-edit
            else
              echo "::error::Merge conflicts need a human. Aborting without touching main."
              git merge --abort
              exit 1
            fi
          fi

      # Belt and braces: a marker reaching main breaks every later build, so refuse
      # to go on if one is present for any reason.
      - name: Refuse to push conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- . ; then
            echo "::error::Conflict markers found in the tree. Not pushing."
            exit 1
          fi

      # ---- Bump patch version in csproj on main ---------------------------
      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          FILE="src/IPAStudio.App/IPAStudio.App.csproj"
          CURRENT=$(grep -oP '(?<=<Version>)[^<]+' "$FILE" | head -1 | tr -d '[:space:]')
          echo "Current: $CURRENT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW="$MAJOR.$MINOR.$PATCH"
          echo "New: $NEW"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          sed -i "s|<Version>${CURRENT}</Version>|<Version>${NEW}</Version>|g" "$FILE"

      - name: Commit version bump on main
        run: |
          git add src/IPAStudio.App/IPAStudio.App.csproj
          git diff --cached --quiet \
            || git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [auto]"

      # ---- Push main -------------------------------------------------------
      # NOTE: a push made with GITHUB_TOKEN does NOT trigger other workflows
      # (GitHub anti-recursion rule), so we cannot rely on auto-release.yml's
      # `push` trigger. Instead we dispatch it explicitly below —
      # workflow_dispatch IS allowed to run even when invoked with GITHUB_TOKEN.
      - name: Push main
        run: git push origin main

      - name: Trigger auto-release on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run auto-release.yml --ref main
