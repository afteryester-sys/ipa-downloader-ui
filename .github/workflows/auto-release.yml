# Runs on every push to main (including merges from v0/** branches).
# Reads the version from csproj, builds the installer, and creates/updates
# a GitHub Release tagged vX.Y.Z so the in-app updater can find it.
#
# If the same version tag already exists the release job is skipped (no
# duplicate releases).  Bump Version in csproj before pushing to get a
# new release.
name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------ build --
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need full history for tag check

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ---- Read version from csproj ----------------------------------------
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/IPAStudio.App/IPAStudio.App.csproj
          $v = ($proj.Project.PropertyGroup.Version |
                Where-Object { $_ } |
                Select-Object -First 1).Trim()
          if (-not $v) { $v = "0.0.0" }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      # ---- Check whether tag already exists --------------------------------
      - name: Check if tag exists
        id: check_tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          # Ensure tags are present locally, then look for an exact match.
          git fetch --tags --quiet 2>$null
          $found = git tag -l $tag
          # NOTE: in PowerShell `$null -ne ""` is TRUE, so we must test for
          # null/empty explicitly instead of comparing to "".
          $exists = if ([string]::IsNullOrWhiteSpace($found)) { "false" } else { "true" }
          "exists=$exists" >> $env:GITHUB_OUTPUT
          Write-Host "Tag $tag exists: $exists"

      # A push with code changes but an unchanged Version used to be silently skipped,
      # leaving users on the old release forever. Re-running the tagged commit is fine;
      # a different commit claiming an existing version is a release error.
      - name: Reject reused version on a new commit
        if: steps.check_tag.outputs.exists == 'true'
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) {
            throw "Version ${{ steps.version.outputs.value }} is already tagged at $tagCommit, but HEAD is $headCommit. Bump <Version> before release."
          }
          Write-Host "$tag already points at this exact commit; nothing to release."

      # ---- Inject the read-only update token into UpdateSecrets.cs ---------
      # UPDATE_TOKEN must be a fine-grained PAT with ONLY "Contents: read" on
      # this repo. If the secret is missing the placeholder is left as-is and
      # the app simply reports "no updates" instead of failing the build.
      - name: Inject update token
        if: steps.check_tag.outputs.exists == 'false'
        shell: pwsh
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          $file = "src/IPAStudio.Core/Services/UpdateSecrets.cs"
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_TOKEN)) {
            Write-Warning "UPDATE_TOKEN secret is empty — in-app updates will not work for the private repo."
          } else {
            (Get-Content $file -Raw).Replace('__UPDATE_TOKEN__', $env:UPDATE_TOKEN) |
              Set-Content $file -NoNewline
            Write-Host "Update token injected."
          }

      # ---- Restore & Build -------------------------------------------------
      - name: Restore
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet restore IPAStudio.sln

      - name: Build
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet build IPAStudio.sln -c Release --no-restore

      # ---- Publish self-contained win-x64 ----------------------------------
      - name: Publish
        if: steps.check_tag.outputs.exists == 'false'
        run: >
          dotnet publish src/IPAStudio.App/IPAStudio.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o build/publish

      # ---- Download bundled CLI tools --------------------------------------
      - name: Fetch tools
        if: steps.check_tag.outputs.exists == 'false'
        shell: pwsh
        run: ./build/Fetch-Tools.ps1 -OutDir build/publish/tools

      # ---- Validate runtime resources and bundled authentication tool ------
      - name: Smoke-test published application
        if: steps.check_tag.outputs.exists == 'false'
        shell: pwsh
        run: |
          # Duplicate ResourceDictionary keys compile but crash WPF while loading App.xaml.
          $duplicates = @()
          Get-ChildItem src/IPAStudio.App -Recurse -Filter *.xaml | ForEach-Object {
            $keys = [regex]::Matches((Get-Content $_.FullName -Raw), 'x:Key="([^"]+)"') |
              ForEach-Object { $_.Groups[1].Value }
            $dupes = $keys | Group-Object | Where-Object Count -gt 1
            foreach ($dupe in $dupes) { $duplicates += "$($_.FullName): $($dupe.Name)" }
          }
          if ($duplicates.Count -gt 0) {
            throw "Duplicate XAML resource keys:`n$($duplicates -join "`n")"
          }

          $ipatool = "build/publish/tools/windows_amd64_v2/ipatool.exe"
          $version = (& $ipatool --version 2>&1 | Out-String).Trim()
          Write-Host "Bundled $version"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '2\.3\.[2-9]|2\.[4-9]\.|[3-9]\.') {
            throw "Bundled ipatool is too old for Apple's current authentication endpoint: $version"
          }

          # Starting the executable catches missing runtime files. It should stay alive long
          # enough to create and show the main window; an immediate exit is a release blocker.
          $process = Start-Process "build/publish/IPAStudio.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            $log = Get-ChildItem "$env:LOCALAPPDATA/IPAStudio/logs" -Filter *.log -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($log) { Get-Content $log.FullName | Write-Host }
            throw "IPAStudio.exe exited during the startup smoke test (code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force

      # ---- Build installer via Inno Setup ----------------------------------
      - name: Build installer
        if: steps.check_tag.outputs.exists == 'false'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.value }}" `
            build\installer.iss

      - name: Verify installer output
        if: steps.check_tag.outputs.exists == 'false'
        shell: pwsh
        run: |
          $expected = "build/output/IPAStudio-Setup-${{ steps.version.outputs.value }}.exe"
          if (-not (Test-Path $expected -PathType Leaf)) {
            throw "Expected installer was not produced: $expected"
          }
          if ((Get-Item $expected).Length -lt 1MB) {
            throw "Installer is unexpectedly small: $expected"
          }

      # ---- Upload installer as artifact ------------------------------------
      - name: Upload installer artifact
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: IPAStudio-Setup-${{ steps.version.outputs.value }}
          path: build/output/*.exe

  # ----------------------------------------------------------------- release --
  release:
    needs: build
    if: needs.build.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: IPAStudio-Setup-${{ needs.build.outputs.version }}
          path: dist

      # Create an annotated tag first so softprops/action-gh-release finds it.
      - name: Create tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.build.outputs.version }}" \
            -m "Release v${{ needs.build.outputs.version }}"
          git push origin "v${{ needs.build.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: IPA Studio v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: dist/*.exe
